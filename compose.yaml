services:
  budgetlite:
    build: .
    ports:
      - "127.0.0.1:3000:3000"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3001:3000"
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    volumes:
      - grafana-data:/var/lib/grafana

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: budgetlite
          static_configs:
            - targets: ["budgetlite:3000"]
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

volumes:
  prometheus-data:
  grafana-data:
