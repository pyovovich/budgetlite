name: BudgetLite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests y build Docker
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      - name: Construir imagen Docker
        run: docker build --platform linux/arm64 --tag budgetlite:ci .

      - name: Verificar que BudgetLite arranca
        run: |
          container_id=$(docker run -d -p 127.0.0.1:3000:3000 budgetlite:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 3 http://127.0.0.1:3000/readyz; then
            docker logs "$container_id"
            exit 1
          fi
