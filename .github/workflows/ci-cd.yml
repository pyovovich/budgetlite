name: BudgetLite CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests y build Docker
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      - name: Descargar Snyk CLI para ARM64
        if: github.event_name == 'push'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/snyk" \
            https://github.com/snyk/cli/releases/download/v1.1308.4/snyk-linux-arm64
          echo "9cf3e55e4bd216138a86a08f6d4235d5a014459cf0df7150818421fd8e044d48  $RUNNER_TEMP/snyk" | sha256sum --check
          chmod +x "$RUNNER_TEMP/snyk"

      - name: Analizar dependencias npm con Snyk
        if: github.event_name == 'push'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: '"$RUNNER_TEMP/snyk" test --package-manager=npm --file=package.json'

      - name: Construir imagen Docker
        run: docker build --platform linux/arm64 --tag budgetlite:ci .

      - name: Verificar que BudgetLite arranca
        run: |
          container_id=$(docker run -d -p 127.0.0.1:3000:3000 budgetlite:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 3 http://127.0.0.1:3000/readyz; then
            docker logs "$container_id"
            exit 1
          fi

      - name: Generar SBOM de producción
        if: github.event_name == 'push'
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --omit=dev > budgetlite-sbom.cdx.json

      - name: Exportar imagen Docker
        if: github.event_name == 'push'
        shell: bash
        run: docker save budgetlite:ci | gzip > budgetlite-linux-arm64.tar.gz

      - name: Guardar entregables
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: budgetlite-linux-arm64
          path: |
            budgetlite-sbom.cdx.json
            budgetlite-linux-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Desplegar en Lima con Terraform
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: [self-hosted, linux, arm64, budgetlite-lima]
    timeout-minutes: 15
    concurrency:
      group: budgetlite-lima-deploy
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          name: budgetlite-linux-arm64
          path: ${{ runner.temp }}/budgetlite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Aplicar Terraform con la imagen verificada
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/budgetlite-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          state_path="$HOME/mundose/terraform/terraform.tfstate"
          test -f "$state_path" || {
            echo "::error::No se encontró el estado del despliegue inicial en $state_path"
            exit 1
          }

          docker load --input "$ARTIFACT_DIR/budgetlite-linux-arm64.tar.gz"
          image_id=$(docker image inspect --format '{{.Id}}' budgetlite:ci)
          export TF_VAR_budgetlite_image_id="$image_id"

          plan_path=$(mktemp "$RUNNER_TEMP/budgetlite-plan.XXXXXX")
          trap 'rm -f "$plan_path"' EXIT
          terraform -chdir=terraform init -reconfigure -backend-config="path=$state_path"
          terraform -chdir=terraform plan -lock-timeout=60s -out="$plan_path"
          terraform -chdir=terraform apply -lock-timeout=60s "$plan_path"

      - name: Verificar BudgetLite en Lima
        run: curl --fail --silent --show-error --max-time 5 http://127.0.0.1:13000/readyz
